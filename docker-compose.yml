services:
  hearth-vtt:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - hearth-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3000/healthz',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  hearth-data:
